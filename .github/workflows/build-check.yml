name: Build verification
on:
  push:
    paths:
      - '.github/workflows/build-check.yml'
      - 'js/**'
      - 'tools/**'
      - 'dev.html'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build prerequisites
        run: python -m pip install Pillow
      - name: Build site
        run: |
          node tools/build.js
          node tools/export_data.js
          python tools/make_seo_pages.py
      - name: Verify generated files
        run: |
          test -s index.html
          test -s js/app.min.js
          test -s version.json
          node --check js/app.min.js
          echo 'Build and JavaScript syntax verification passed'
